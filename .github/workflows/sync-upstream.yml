name: Sync fork with upstream

# Keeps `develop` in step with CPJKU/partitura. Only fast-forwards —
# if local has diverged (shouldn't happen on this branch, but
# defensive), it's skipped and the run log notes it.
#
# Why only `develop` (not `main`):
# - Scheduled workflows fire from the fork's default branch (`main`).
# - This file lives on `main`. If `main` were also auto-synced, the
#   sync would delete this file the moment upstream/main moves,
#   killing future runs.
# - `main` rarely changes upstream — sync it manually via GitHub's
#   "Sync fork" button on the web UI when needed.
#
# Feature branches in this fork (e.g. fix/musicxml-…) are NOT
# touched. They live and die with their PR.

on:
  schedule:
    # Daily at 09:00 UTC.
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        branch: [develop]
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add upstream remote
        run: git remote add upstream https://github.com/CPJKU/partitura.git

      - name: Fetch upstream
        run: git fetch upstream ${{ matrix.branch }}

      - name: Fast-forward ${{ matrix.branch }} or skip
        run: |
          git checkout ${{ matrix.branch }}
          # Only push if upstream is strictly ahead (fast-forward).
          if git merge-base --is-ancestor HEAD upstream/${{ matrix.branch }}; then
            git merge --ff-only upstream/${{ matrix.branch }}
            git push origin ${{ matrix.branch }}
            echo "::notice ::Fast-forwarded ${{ matrix.branch }} to $(git rev-parse --short HEAD)"
          else
            echo "::warning ::${{ matrix.branch }} has diverged from upstream; skipping. Resolve manually if intended."
          fi
